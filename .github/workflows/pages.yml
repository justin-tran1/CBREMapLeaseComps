name: Deploy to GitHub Pages

# Publishes the built app to GitHub Pages. The site is public, and so is this
# repository; nothing secret belongs in the bundle. A visitor's Google Maps key,
# when they set one, is kept in their own browser storage and never ships here.
on:
  push:
    branches:
      - main
      - claude/lease-mapping-dashboard-bk44k8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is superseded by a newer one, but a
# deployment already writing the site is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # enablement turns Pages on the first time this runs, so the site does not
      # have to be switched on by hand before the first deployment.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is built with a relative base, so it runs from the project
      # subpath Pages serves it under without any further rewriting.
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
